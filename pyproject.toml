[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "coding-pet"
version = "0.1.0"
description = "Multi-agent coding pet for monitoring Claude Code and OpenCode sessions on Linux desktops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "PySide6>=6.8,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
coding-pet = "coding_pet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_pet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
strict = true
warn_unused_configs = true
